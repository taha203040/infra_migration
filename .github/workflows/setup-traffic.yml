name: Setup Traffic Generator

on:
  workflow_dispatch:

jobs:
  setup-k6:
    runs-on: ubuntu-latest

    steps:
      - name: Create traffic test file
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.K6_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Verify K6 is already installed
            command -v k6 >/dev/null 2>&1 || {
              echo "K6 is not installed."
              exit 1
            }

            k6 version

            # Create traffic test directory
            mkdir -p "$HOME/migration-load-test"

            cd "$HOME/migration-load-test"

            # Create traffic test script
            cat > traffic.ts <<EOF
            import http from 'k6/http';
            import { check, sleep } from 'k6';

            export const options = {
              vus: 5,
              duration: '30s',
            };

            export default function () {
              const response = http.get('http://${{ secrets.EC_APP_PRV }}:3000');

              check(response, {
                'status is 200': (r) => r.status === 200,
              });

              sleep(1);
            }
            EOF

            echo "Traffic test file created successfully."