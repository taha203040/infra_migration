name: Setup App

on:
  workflow_dispatch:

jobs:
  setup-app:
    runs-on: ubuntu-latest

    steps:
      - name: Setup application on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.APP_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="$HOME/migration"

            # Clone or update the repository
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/taha203040/migration.git "$APP_DIR"
            else
              git -C "$APP_DIR" pull --ff-only
            fi

            cd "$APP_DIR"
            # Install global TypeScript and tsx
            sudo npm install -g typescript tsx

            # Verify installations
            tsc --version
            tsx --version

            # Create environment configuration
            umask 077

            cat > .env <<EOF
            PORT=3000
            DATABASE_URL=postgresql://postgres:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_PRV_IP }}:5432/migration_lab
            EOF
            # Install project dependencies
            npm ci

            # Install missing TypeScript dependencies
            npm install --save-dev \
              typescript \
              tsx \
              @types/node \
              @types/express \
              @types/pg

            # Verify TypeScript tools
            npx tsc --version
            npx tsx --version
            # Build the application
            npm run build

            # Stop previous application process
            if [ -f "$HOME/migration.pid" ]; then
              OLD_PID=$(cat "$HOME/migration.pid")

              if kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID"
                sleep 2

                if kill -0 "$OLD_PID" 2>/dev/null; then
                  kill -9 "$OLD_PID"
                fi
              fi
            fi

            # Start application
            nohup npm start > "$HOME/migration.log" 2>&1 &
            echo $! > "$HOME/migration.pid"

            sleep 5

            # Verify process
            if ! kill -0 "$(cat "$HOME/migration.pid")" 2>/dev/null; then
              cat "$HOME/migration.log"
              exit 1
            fi

            echo "✅Application started successfully✅."