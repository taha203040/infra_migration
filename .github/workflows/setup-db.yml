name: Setup Database

on:
  workflow_dispatch:

jobs:
  setup-db:
    runs-on: ubuntu-latest

    steps:
      - name: Configure PostgreSQL and create schema
        uses: appleboy/ssh-action@v1.2.2

        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PRV_IP: ${{ secrets.DB_PRV_IP }}

        with:
          host: ${{ secrets.DB_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,DB_PRV_IP

          script: |
            set -euo pipefail

            # 1. Validate environment
            if [[ -z "$DB_PASSWORD" || -z "$DB_PRV_IP" ]]; then
              echo "ERROR: Missing database configuration."
              exit 1
            fi

            # 2. Verify PostgreSQL service
            sudo systemctl is-active --quiet postgresql || {
              echo "ERROR: PostgreSQL is not running."
              exit 1
            }

            # 3. Configure or rotate postgres password
            echo "Configuring PostgreSQL password..."

            echo "Configuring PostgreSQL password..."

            cd /tmp

            sudo -u postgres psql \
              -v ON_ERROR_STOP=1 \
              --set=password="$DB_PASSWORD" <<'SQL'

            ALTER ROLE postgres WITH PASSWORD :'password';

            SQL

            echo "PostgreSQL password configured."

            echo "PostgreSQL password configured."

            # 4. Configure password authentication
            export PGPASSWORD="$DB_PASSWORD"

            # 5. Verify TCP connection
            psql \
              -h "$DB_PRV_IP" \
              -U postgres \
              -d postgres \
              -v ON_ERROR_STOP=1 \
              -c "SELECT version();"

            # 6. Create database if it does not exist
            DB_EXISTS=$(psql \
              -h "$DB_PRV_IP" \
              -U postgres \
              -d postgres \
              -tAc "SELECT 1 FROM pg_database WHERE datname = 'migration_lab'")

            if [[ "$DB_EXISTS" != "1" ]]; then
              psql \
                -h "$DB_PRV_IP" \
                -U postgres \
                -d postgres \
                -v ON_ERROR_STOP=1 \
                -c "CREATE DATABASE migration_lab"

              echo "Database created."
            else
              echo "Database already exists."
            fi

            # 7. Create schema
            psql \
              -h "$DB_PRV_IP" \
              -U postgres \
              -d migration_lab \
              -v ON_ERROR_STOP=1 <<'SQL'

            CREATE TABLE IF NOT EXISTS users (
                id BIGSERIAL PRIMARY KEY,
                email TEXT NOT NULL UNIQUE,
                password_hash TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );

            CREATE TABLE IF NOT EXISTS posts (
                id BIGSERIAL PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES users(id),
                title TEXT NOT NULL,
                content TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );

            CREATE INDEX IF NOT EXISTS idx_posts_user_id
                ON posts(user_id);

            SQL

            # 8. Verify tables
            echo "--- Verifying tables ---"

            psql \
              -h "$DB_PRV_IP" \
              -U postgres \
              -d migration_lab \
              -v ON_ERROR_STOP=1 \
              -c "\dt"

            unset PGPASSWORD

            echo "Database setup completed successfully."